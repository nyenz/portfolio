# Render Blueprint: free static site for the whole portfolio.
services:
  - type: web
    name: nyende-portfolio
    runtime: static
    buildCommand: npm ci && BASE=/ npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
