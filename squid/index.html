<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The Colossal Squid — Nyende David</title>
  <meta name="description" content="A study of the colossal squid, built in Three.js by Nyende David." />
  <meta name="theme-color" content="#021018" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;800&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet" />
</head>
<body class="sq">
  <canvas id="sq-world" aria-hidden="true"></canvas>
  <header class="sq-top">
    <a class="sq-back" href="../" data-cursor>&larr; Back to the dive</a>
    <p class="sq-tag">Study 01 · Colossal squid</p>
  </header>
  <section class="sq-info">
    <h1 class="sq-title">The Colossal Squid</h1>
    <p class="sq-lead">Built from code, no 3D model files. Drag to look around, scroll to zoom. Move fast near it and it gets nervous.</p>
    <div class="sq-modes" role="group" aria-label="Swim mode">
      <button type="button" data-mode="cruise" class="is-on">Swim up</button>
      <button type="button" data-mode="idle">Hover</button>
      <button type="button" data-mode="jet">Jet</button>
    </div>
  </section>
  <script type="module" src="/src/pages/squid.js"></script>
</body>
</html>
